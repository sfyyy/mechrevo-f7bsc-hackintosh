<!doctype html><html><head><style>
body{margin:0;font:16px sans-serif} .row{padding:12px;border-bottom:1px solid #ccc;background:linear-gradient(90deg,#fff,#eef)}
canvas{position:fixed;right:10px;top:10px;width:400px;height:300px;border:1px solid #000}
.box{position:fixed;left:20px;top:20px;width:120px;height:120px;background:rgba(255,0,0,.5);border-radius:20px;box-shadow:0 0 30px #000}
</style></head><body><canvas id=c width=800 height=600></canvas><div class=box id=b></div><div id=list></div><script>
const L=document.getElementById('list');let h='';for(let i=0;i<3000;i++)h+=`<div class=row>Row ${i} — lorem ipsum dolor sit amet <b>bold</b> <i>italic</i> ${'x'.repeat(i%80)}</div>`;L.innerHTML=h;
const c=document.getElementById('c').getContext('2d'),b=document.getElementById('b');
let n=0,t0=performance.now(),last=t0,worst=0,jank=0,dir=1;
function f(t){const dt=t-last;last=t;if(dt>worst)worst=dt;if(dt>25)jank++;n++;
 c.fillStyle=`hsl(${t/10%360},70%,50%)`;c.fillRect(0,0,800,600);for(let i=0;i<200;i++){c.fillStyle=`hsl(${i*7},80%,60%)`;c.beginPath();c.arc(400+300*Math.sin(t/500+i),300+250*Math.cos(t/700+i*1.3),10,0,7);c.fill()}
 b.style.transform=`translate(${300+250*Math.sin(t/400)}px,${300+200*Math.cos(t/300)}px) rotate(${t/5}deg)`;
 window.scrollBy(0,6*dir);if(scrollY+innerHeight>=document.body.scrollHeight-5)dir=-1;if(scrollY<=0)dir=1;
 if(t-t0>=3000){console.log(`FPS ${(n*1000/(t-t0)).toFixed(1)} worst_ms ${worst.toFixed(0)} jank ${jank}`);n=0;t0=t;worst=0;jank=0}
 requestAnimationFrame(f)}requestAnimationFrame(f);
</script></body></html>
