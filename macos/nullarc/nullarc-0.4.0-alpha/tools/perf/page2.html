<!doctype html><html><head><style>
body{margin:0;font:16px sans-serif} .row{padding:12px;border-bottom:1px solid #ccc;background:linear-gradient(90deg,#fff,#eef)}
canvas{position:fixed;right:10px;top:10px;width:400px;height:300px;border:1px solid #000}
.box{position:fixed;left:20px;top:20px;width:120px;height:120px;background:rgba(255,0,0,.5);border-radius:20px;box-shadow:0 0 30px #000}
</style></head><body><canvas id=c width=800 height=600></canvas><div class=box id=b></div><div id=list></div><script>
// page.html with switchable load: ?m=all (same as page.html) | empty | scroll | canvas | box (any '+' combination).
// Logs per 3 s: FPS, worst frame, jank (>25 ms), the frame-interval histogram in vsync periods, and the JS time of the
// slowest frame (if a 67 ms frame spent 2 ms in JS, the page's main thread did not cause it).
const m=(new URLSearchParams(location.search).get('m')||'all');const has=k=>m==='all'||m.split('+').includes(k);
const L=document.getElementById('list');if(has('scroll')){let h='';for(let i=0;i<3000;i++)h+=`<div class=row>Row ${i} — lorem ipsum dolor sit amet <b>bold</b> <i>italic</i> ${'x'.repeat(i%80)}</div>`;L.innerHTML=h;}
if(!has('canvas'))document.getElementById('c').style.display='none';if(!has('box'))document.getElementById('b').style.display='none';
const c=document.getElementById('c').getContext('2d'),b=document.getElementById('b');
let n=0,t0=performance.now(),last=t0,worst=0,jank=0,dir=1,hist=[0,0,0,0,0],worstJs=0,longJs=0;
function f(t){const s=performance.now();const dt=t-last;last=t;if(dt>worst){worst=dt;worstJs=-1}if(dt>25)jank++;n++;
 hist[Math.min(4,Math.max(0,Math.round(dt/16.67)-1))]++;
 if(has('canvas')){c.fillStyle=`hsl(${t/10%360},70%,50%)`;c.fillRect(0,0,800,600);for(let i=0;i<200;i++){c.fillStyle=`hsl(${i*7},80%,60%)`;c.beginPath();c.arc(400+300*Math.sin(t/500+i),300+250*Math.cos(t/700+i*1.3),10,0,7);c.fill()}}
 if(has('box'))b.style.transform=`translate(${300+250*Math.sin(t/400)}px,${300+200*Math.cos(t/300)}px) rotate(${t/5}deg)`;
 if(has('scroll')){window.scrollBy(0,6*dir);if(scrollY+innerHeight>=document.body.scrollHeight-5)dir=-1;if(scrollY<=0)dir=1;}
 const js=performance.now()-s;if(worstJs<0)worstJs=js;if(js>8)longJs++;
 if(t-t0>=3000){console.log(`FPS ${(n*1000/(t-t0)).toFixed(1)} worst_ms ${worst.toFixed(0)} jank ${jank} hist ${hist.join('/')} worstjs ${worstJs.toFixed(1)} longjs ${longJs} at ${Date.now()}`);n=0;t0=t;worst=0;jank=0;hist=[0,0,0,0,0];longJs=0}
 requestAnimationFrame(f)}requestAnimationFrame(f);
</script></body></html>
